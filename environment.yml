name: mio
channels:
  - conda-forge
  - nodefaults
variables:
  PYTHONNOUSERSITE: "1"
dependencies:
  - python=3.11

  # Core numerics
  - numpy>=1.26
  - scipy>=1.12
  - h5py>=3.10
  - matplotlib>=3.8
  - vtk>=9.3  # ParaView export (DD-115): geometry.vtm, frequency .vtr series
  - pyvista>=0.44  # 3D viewer (DD-190): model.plot(), screenshots in the docs

  # CAD / geometry
  - pythonocc-core>=7.9  # conda-forge only

  # Solver acceleration (see design-decisions.md DD-032: three-tier kernel
  # dispatch — Numba CPU fused / CUDA fused / NumPy-CuPy stencil fallback)
  - numba>=0.59

  # Notebook applications and viewer dependencies are all from conda-forge.
  # trame-pyvista supplies its compatible trame stack. Do not install the
  # trame Jupyter extension: the viewer uses its own websocket transport.
  - notebook
  - jupyterlab
  - ipykernel
  - ipywidgets
  - anywidget>=0.9
  - trame-pyvista>=0.1.5
  - nest-asyncio2

  # Dev tools
  - pytest
  - pytest-cov
  - ruff
  - mypy

  # Docs build (mirrors the pyproject [docs] extra)
  - sphinx>=7.0
  - myst-parser>=2.0
  - sphinxcontrib-bibtex>=2.6
  - pydata-sphinx-theme>=0.15
  - sphinx-gallery>=0.15
  - sphinx-design>=0.6  # tab set around the interactive 3D views

  # Build the local editable checkout without fetching build dependencies.
  - hatchling
  - pip
