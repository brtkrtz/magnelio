# Local lint/format gate; same rules as CI (both read [tool.ruff] in
# pyproject.toml).  rev is pinned to the ruff version in the magnelio
# environment — keep the two in sync when upgrading.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff-check
      - id: ruff-format
  # Content gate, same script as CI and the workspace pre-push hook:
  # vendor names, unmarked private-workspace paths, home paths,
  # addresses.  Standard library only, so the system python suffices.
  - repo: local
    hooks:
      - id: public-hygiene
        name: public hygiene (vendor names, private paths, addresses)
        entry: python validation/tools/check_public_hygiene.py
        language: system
        pass_filenames: false
        always_run: true
