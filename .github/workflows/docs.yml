name: Docs

# Build the Sphinx documentation (sphinx-gallery executes all
# tutorials, CPU-only: allow ~1 h) and publish it into the gh-pages
# branch, which is the Pages source ("Deploy from a branch").
#
# The site carries two channels, each a complete build in its own
# directory:
#
#   /stable/  the newest release — built from a v* tag, and where the
#             site root redirects to
#   /dev/     the current main branch
#
# A channel is only rebuilt when its own source moves, because a build
# costs an hour; the other channel and the shared root files survive a
# publish untouched.  Deployment on push is gated by the repository
# variable DEPLOY_DOCS == 'true'; workflow_dispatch always runs.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build (blank: the ref this run was started from)"
        required: false
        default: ""
      channel:
        description: "Channel to publish into (auto: tags to stable, anything else to dev)"
        type: choice
        options: [auto, dev, stable]
        default: auto

# Only the publish job writes to the branch; building needs no more
# than read access.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_DOCS == 'true'
    outputs:
      channel: ${{ steps.target.outputs.channel }}
    steps:
      - name: Resolve ref and channel
        id: target
        env:
          IN_REF: ${{ inputs.ref }}
          IN_CHANNEL: ${{ inputs.channel }}
        run: |
          REF="${IN_REF:-$GITHUB_REF}"
          CHANNEL="${IN_CHANNEL:-auto}"
          if [ "$CHANNEL" = auto ]; then
            case "$REF" in
              refs/tags/v*) CHANNEL=stable ;;
              *)            CHANNEL=dev ;;
            esac
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "building $REF into /$CHANNEL/"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
      # environment.yml (not pip): the geometry tutorials need
      # pythonocc-core, which exists only on conda-forge.
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          init-shell: bash
          cache-environment: true
      # -d keeps Sphinx's doctree cache out of the HTML output.  Its
      # default location is <outdir>/.doctrees, which is 96 MB of
      # pickles per build — nothing a browser ever asks for, but the
      # publish below would commit all of it, and pickles change
      # wholesale from build to build.
      # The 3D viewer renders screenshots through VTK, which needs an
      # OpenGL context.  GPU-less runners have neither an EGL device nor
      # libOSMesa, so a virtual X display with Mesa's software GL is
      # provided (the same setup PyVista's own CI uses).
      - uses: pyvista/setup-headless-display-action@v5
      - run: sphinx-build -b html -d docs/_build/doctrees docs docs/_build/html
        shell: bash -el {0}
        env:
          MAGNELIO_DOCS_CHANNEL: ${{ steps.target.outputs.channel }}
          PYVISTA_OFF_SCREEN: "true"

      # Everything the publish needs, and nothing else: the built HTML
      # and the switcher list that goes to the site root.
      - name: Collect the publishable tree
        run: |
          set -euo pipefail
          mkdir -p publish
          cp -a docs/_build/html publish/html
          cp docs/switcher.json publish/switcher.json
      - uses: actions/upload-artifact@v4
        with:
          name: docs-${{ steps.target.outputs.channel }}
          path: publish
          retention-days: 1

  # The gh-pages branch is a single writable tree, so publishes are
  # serialised.  The lock sits on this job rather than on the workflow:
  # a concurrency group holds only one queued run, and a third arrival
  # cancels the one already waiting — with the whole workflow in the
  # group, that window spanned the full build and a tag's publish could
  # be dropped by a push that landed while it built.  Here the window is
  # the few seconds this job takes.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: docs-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-${{ needs.build.outputs.channel }}
          path: publish

      - name: Publish into the gh-pages branch
        env:
          CHANNEL: ${{ needs.build.outputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Shallow, single-branch: the published site accumulates a few
          # megabytes of gallery images per build, and none of that
          # history is needed to add one directory to the tip.
          if ! git clone --branch gh-pages --single-branch --depth 1 "$REPO" site; then
            mkdir site
            git -C site init -q
            git -C site remote add origin "$REPO"
            git -C site checkout -q --orphan gh-pages
          fi

          rm -rf "site/${CHANNEL}"
          mkdir -p "site/${CHANNEL}"
          cp -a publish/html/. "site/${CHANNEL}/"

          # One shared switcher list at the site root, so a frozen
          # release build reads the current set of channels rather than
          # the one it was built with.
          cp publish/switcher.json site/switcher.json

          # Pages runs Jekyll on a branch source, and Jekyll hides every
          # path starting with an underscore — without this marker the
          # site loads without _static/ and renders unstyled.
          touch site/.nojekyll

          # Land readers on the release docs; fall back to dev until a
          # tag has been published once.
          LANDING=stable
          [ -d site/stable ] || LANDING=dev
          cat > site/index.html <<EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <title>Magnelio Documentation</title>
              <meta http-equiv="refresh" content="0; url=./${LANDING}/">
              <link rel="canonical" href="./${LANDING}/">
            </head>
            <body>
              <p>Redirecting to the <a href="./${LANDING}/">Magnelio documentation</a>.</p>
            </body>
          </html>
          EOF

          cd site
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "docs: publish ${CHANNEL} from ${GITHUB_SHA}" \
            || { echo "no change to publish"; exit 0; }
          git push -q origin gh-pages \
            || { git pull --rebase -q origin gh-pages && git push -q origin gh-pages; }
